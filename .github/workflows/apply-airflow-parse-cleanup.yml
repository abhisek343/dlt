name: Apply Airflow parse cleanup patch

on:
  push:
    branches:
      - fix/airflow-parse-time-pipeline-cleanup
    paths:
      - .github/workflows/apply-airflow-parse-cleanup.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply and validate patch
        run: |
          git apply --check .patches/airflow-parse-cleanup.patch
          git apply .patches/airflow-parse-cleanup.patch
          python -m py_compile \
            dlt/helpers/airflow_helper.py \
            tests/helpers/airflow_tests/test_airflow_parse_cleanup.py
          git diff --check

      - name: Commit final changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .patches/airflow-parse-cleanup.patch \
            .github/workflows/apply-airflow-parse-cleanup.yml
          git add \
            dlt/helpers/airflow_helper.py \
            tests/helpers/airflow_tests/test_airflow_parse_cleanup.py
          git commit -m "fix(airflow): clean parse-time pipeline folders"
          git push origin HEAD:${{ github.ref_name }}
