name: Validate Airflow parse cleanup

on:
  push:
    branches:
      - fix/airflow-parse-time-pipeline-cleanup
    paths:
      - .github/workflows/validate-airflow-parse-cleanup.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true

      - name: Install dlt and Airflow dependencies
        run: |
          uv sync --group pipeline --extra duckdb --extra parquet
          uv run python tools/install_airflow_ci.py '>=2.8.0,<3'

      - name: Run Airflow helper regression tests
        run: |
          pytest \
            tests/helpers/airflow_tests/test_airflow_parse_cleanup.py \
            tests/helpers/airflow_tests/test_airflow_wrapper.py

      - name: Remove temporary validation workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-airflow-parse-cleanup.yml
          git commit -m "chore: remove temporary Airflow validation workflow"
          git push origin HEAD:${{ github.ref_name }}
